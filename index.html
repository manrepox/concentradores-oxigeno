<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mantenimiento y Reparación de Concentradores de Oxígeno</title>
<style>
:root {
  --primary: #023e8a;
  --secondary: #00b4d8;
  --accent: #ffd60a;
  --bg: #f8f9fa;
  --text: #333;
}
body { font-family: Arial, sans-serif; margin:0; padding:0; line-height:1.6; background:var(--bg); color:var(--text); overflow-x:hidden; }

header {
  background: var(--primary);
  color:white;
  padding:80px 20px;
  text-align:center;
  background-image: url("img/header.jpg");
  background-size:cover;
  background-position:center;
  position: relative;
}
header h1 { margin:0; font-size:3rem; background:rgba(0,0,0,0.6); display:inline-block; padding:15px 20px; border-radius:10px; animation: fadeInDown 1s ease; }
header p { margin:15px 0; font-size:1.4rem; background:rgba(0,0,0,0.4); display:inline-block; padding:10px 15px; border-radius:8px; animation: fadeInUp 1s ease; }
.btn { display:inline-flex; align-items:center; justify-content:center; background:var(--secondary); color:white; padding:12px 24px; margin-top:20px; text-decoration:none; border-radius:5px; transition: all 0.3s ease; animation: fadeIn 1.5s ease; font-size:1.1rem; cursor:pointer; }
.btn svg { margin-right:8px; width:24px; height:24px; }
.btn:hover { background:#0096c7; transform: scale(1.05); }

.btn-whatsapp {
  background-color: #25d366;
}
.btn-whatsapp:hover {
  background-color: #1ebe5d;
}

section { padding:50px 20px; max-width:1000px; margin:auto; opacity:0; transform:translateY(30px); transition: all 1s ease; }
section.visible { opacity:1; transform:translateY(0); }
section h2 { color:var(--primary); margin-bottom:20px; text-align:center; }
section p { margin-bottom:15px; }

.services, .benefits { display:grid; grid-template-columns:repeat(auto-fit, minmax(250px,1fr)); gap:20px; }
.card { background:white; border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,0.15); padding:20px; text-align:center; transition: transform 0.3s ease; }
.card:hover { transform: translateY(-5px) scale(1.02); }
.card img { max-width:100%; border-radius:10px; margin-bottom:15px; }

footer { background:var(--primary); color:white; text-align:center; padding:15px; margin-top:40px; }
footer a { color:white; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; margin:0 5px; font-size:1.1rem; }
footer svg { width:20px; height:20px; margin-right:5px; }

.whatsapp-float, .call-float {
  position:fixed;
  width:90px;
  height:90px;
  bottom:20px;
  border-radius:50%;
  text-align:center;
  font-size:36px;
  box-shadow:2px 2px 5px #999;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  transition: transform 0.3s ease;
}
.whatsapp-float { right:20px; background-color:#25d366; color:#fff; }
.call-float { right:120px; background-color:#00b4d8; color:#fff; }

.whatsapp-float:hover, .call-float:hover { transform: scale(1.1); }
.whatsapp-float img, .call-float img { width:55px; height:55px; }

.carousel { position:relative; max-width:600px; margin:auto; overflow:hidden; border-radius:10px; }
.carousel-track { display:flex; transition: transform 0.5s ease-in-out; }
.carousel-card { min-width:100%; box-sizing:border-box; padding:20px; background:white; margin-right:10px; box-shadow:0 2px 6px rgba(0,0,0,0.15); border-radius:10px; text-align:center; }
.carousel-card h3 { margin-bottom:10px; }
.carousel-card p { margin-bottom:10px; font-style:italic; }
.carousel-buttons { text-align:center; margin-top:10px; }
.carousel-buttons button { background:var(--secondary); color:white; border:none; padding:8px 12px; margin:0 5px; border-radius:5px; cursor:pointer; transition: transform 0.3s; }
.carousel-buttons button:hover { transform: scale(1.1); }

@keyframes fadeInDown { from {opacity:0; transform: translateY(-20px);} to {opacity:1; transform: translateY(0);} }
@keyframes fadeInUp { from {opacity:0; transform: translateY(20px);} to {opacity:1; transform: translateY(0);} }
@keyframes fadeIn { from {opacity:0;} to {opacity:1;} }

@media (max-width: 768px) {
  header h1 { font-size:2.2rem; padding:12px 15px; }
  header p { font-size:1.1rem; padding:8px 10px; }
  .btn { font-size:1rem; padding:10px 20px; }
  .whatsapp-float, .call-float { width:75px; height:75px; font-size:32px; }
  .whatsapp-float img, .call-float img { width:45px; height:45px; }
  .two-columns { grid-template-columns:1fr !important; }
}
@media (max-width: 480px) {
  header h1 { font-size:1.8rem; padding:10px 12px; }
  header p { font-size:1rem; padding:6px 8px; }
  .btn { font-size:0.95rem; padding:8px 16px; }
  .whatsapp-float, .call-float { width:65px; height:65px; font-size:28px; }
  .whatsapp-float img, .call-float img { width:40px; height:40px; }
}
</style>
</head>
<body>

<header>
  <h1>Mantenimiento y Reparación de Concentradores de Oxígeno</h1>
  <p>Servicio confiable a domicilio en Ciudad de México y zona metropolitana</p>
  <div style="display:flex; justify-content:center; gap:15px; flex-wrap:wrap;">
    <a href="tel:+525651546640" class="btn">
      📞 Llamar ahora
    </a>
    <a href="https://wa.me/525651546640" class="btn btn-whatsapp" target="_blank">
      <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp" style="width:24px; height:24px; margin-right:8px;">
      WhatsApp
    </a>
  </div>
</header>

<!-- resto del contenido sin modificar -->
<footer>
  <p>&copy; 2025 Mantenimiento y Reparación de Concentradores de Oxígeno. Todos los derechos reservados.</p>
</footer>

<!-- Botones flotantes -->
<a href="tel:+525651546640" class="call-float">
  <img src="https://upload.wikimedia.org/wikipedia/commons/3/3b/Phone_font_awesome.svg" alt="Llamar">
</a>

<a href="https://wa.me/525651546640" class="whatsapp-float" target="_blank">
  <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
</a>

<script>
// Animación al hacer scroll
const sections = document.querySelectorAll('section');
const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if(entry.isIntersecting){
      entry.target.classList.add('visible');
    }
  });
}, { threshold: 0.1 });
sections.forEach(section => observer.observe(section));

// Formulario WhatsApp
const contactForm = document.getElementById('contactForm');
if(contactForm){
  contactForm.addEventListener('submit', function(e){
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const email = document.getElementById('email').value.trim();
    const message = document.getElementById('message').value.trim();
    const whatsappNumber = '525651546640';
    const text = `Hola, mi nombre es ${name}. Mi teléfono es ${phone} y mi correo es ${email}. Mensaje: ${message}`;
    const url = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(text)}`;
    window.open(url, '_blank');
  });
}
</script>

</body>
</html>
